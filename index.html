<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>ESP32 遠端開關</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <h2>ESP32 遠端開關</h2>

        <label class="switch">
            <input type="checkbox" id="mqtt-toggle" onchange="onToggleChange()">
            <span class="slider"></span>
        </label>

        <div class="mqtt-status">
            <span class="dot"></span>
            <span id="status-label">ESP32 狀態：已連線 (MQTT)</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
